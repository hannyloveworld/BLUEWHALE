name: Security Scan

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  pull_request:
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'packages/core-go/go.mod'
      - 'packages/core-go/go.sum'
      - 'packages/core-dart/pubspec.yaml'
      - 'packages/core-dart/pubspec.lock'
      - 'examples/prism-core/Cargo.toml'
      - 'examples/rust-address-fuzzer/Cargo.toml'
      - '.github/workflows/security-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

  audit-npm:
    name: npm audit (pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Audit npm dependencies
        run: pnpm audit --audit-level=high

  audit-go:
    name: govulncheck (core-go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.21'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
        working-directory: packages/core-go

  audit-dart:
    name: dart dependency audit (core-dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check package dependencies
        run: dart pub get
        working-directory: packages/core-dart

  audit-rust-prism:
    name: cargo audit (prism-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: examples/prism-core

  audit-rust-fuzzer:
    name: cargo audit (rust-address-fuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
        working-directory: examples/rust-address-fuzzer

  security-gate:
    name: security gate
    runs-on: ubuntu-latest
    needs: [secret-scan, audit-npm, audit-go, audit-dart, audit-rust-prism, audit-rust-fuzzer]
    if: always()
    steps:
      - name: Enforce all audits passed
        if: >
          needs.secret-scan.result != 'success' ||
          needs.audit-npm.result != 'success' ||
          needs.audit-go.result != 'success' ||
          needs.audit-dart.result != 'success' ||
          needs.audit-rust-prism.result != 'success' ||
          needs.audit-rust-fuzzer.result != 'success'
        run: |
          echo "::error::Security scan failed — at least one security check failed or found vulnerabilities."
          echo "::error::secret-scan:        ${{ needs.secret-scan.result }}"
          echo "::error::npm audit:          ${{ needs.audit-npm.result }}"
          echo "::error::govulncheck go:     ${{ needs.audit-go.result }}"
          echo "::error::dart audit:         ${{ needs.audit-dart.result }}"
          echo "::error::cargo audit prism:  ${{ needs.audit-rust-prism.result }}"
          echo "::error::cargo audit fuzzer: ${{ needs.audit-rust-fuzzer.result }}"
          exit 1
